name: QA Flow

permissions:
  security-events: write
  pull-requests: write
  packages: read
  actions: read
  contents: read
  deployments: write
  issues: write
  checks: write
  statuses: write # Used by CM to mark commit status

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain'
        required: true
        type: choice
        options:
          - dominio1
          - dominio2
          - technology
      subdomain:
        description: 'Subdomain'
        required: true
        type: string
      destination:
        description: 'Destination'
        required: true
        type: string

run-name: Deploy to QA Databricks at domain ${{ inputs.domain }} subdomain ${{ inputs.subdomain }} destination ${{ inputs.destination }} by @${{ github.actor }}

jobs:
  get_version:
    if: github.ref == 'refs/heads/qa'
    name: Get version
    outputs:
      version: ${{ steps.set_version.outputs.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set Version
        id: set_version
        run: |
          echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
  
  validate_job:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate detalles.md
        id: check-details
        shell: bash
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: |
          set -uo pipefail

          DETAILS_FILE="${TARGET_PATH}/detalles.md"

          # Default: no destroy
          echo "isDestroy=false" >> "$GITHUB_OUTPUT"

          echo "Checking path: ${TARGET_PATH}"
          echo "Checking file: ${DETAILS_FILE}"

          # --------------------------------------------------
          # 1. La ruta no existe
          # --------------------------------------------------
          if [[ ! -d "$TARGET_PATH" ]]; then
            echo "Path does not exist: ${TARGET_PATH}"

            {
              echo "## ✅ Destroy validation"
              echo ""
              echo "Path \`${TARGET_PATH}\` does not exist."
              echo ""
              echo "**isDestroy:** \`false\`"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          # --------------------------------------------------
          # 2. detalles.md no existe
          # --------------------------------------------------
          if [[ ! -f "$DETAILS_FILE" ]]; then
            echo "File does not exist: ${DETAILS_FILE}"

            {
              echo "## ✅ Destroy validation"
              echo ""
              echo "File \`${DETAILS_FILE}\` does not exist."
              echo ""
              echo "**isDestroy:** \`false\`"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          # --------------------------------------------------
          # 3. Leer action
          # --------------------------------------------------
          ACTION=$(python - <<'PY'
          import os
          import re
          from pathlib import Path

          file_path = Path(os.environ["TARGET_PATH"]) / "detalles.md"

          try:
              content = file_path.read_text(encoding="utf-8")
          except Exception:
              print("")
              raise SystemExit(0)

          match = re.search(
              r"<action>\s*(.*?)\s*</action>",
              content,
              re.IGNORECASE | re.DOTALL
          )

          print(match.group(1).strip() if match else "")
          PY
          )

          echo "Detected action: '${ACTION}'"

          # --------------------------------------------------
          # 4. Detectar destroy
          # --------------------------------------------------
          if [[ "${ACTION,,}" == "destroy" ]]; then

            echo "isDestroy=true" >> "$GITHUB_OUTPUT"

            echo "::error title=DESTROY detected::The resource at '${TARGET_PATH}' is marked for destruction."

            {
              echo "## 🛑 DESTROY detected"
              echo ""
              echo "> [!WARNING]"
              echo "> **This resource is marked for destruction.**"
              echo ""
              echo "**Path:** \`${TARGET_PATH}\`"
              echo ""
              echo "**Action:** \`destroy\`"
              echo ""
              echo "**isDestroy:** \`true\`"
            } >> "$GITHUB_STEP_SUMMARY"

          fi

  validate_deploy:
    needs: [get_version, validate_job]
    if: github.ref == 'refs/heads/qa'
    uses: nriofrio2508/my_reusable/.github/workflows/deploy_lakehouse.yml@main
    with:
      environment: qa
      releaseToDeploy: ${{ needs.get_version.outputs.version }}
      pathToDeploy: ${{ inputs.domain }}/${{ inputs.subdomain }}/${{ inputs.destination }}
    secrets: inherit
  
  validate_job_automation:
    needs: validate_deploy
    if: vars.TESTS_ENABLED == 'true'
    uses: nriofrio2508/my_reusable/.github/workflows/validate_databricks_job_automation.yml@main
    with:
      domain: ${{ inputs.domain }}
      subdomain: ${{ inputs.subdomain }}
      destination: ${{ inputs.destination }}
      development_branch_name: ${{ github.ref_name }}
      development_framework_repository: app-lakehouse-yape
      test_framework_repository: fwk-data-tests
    secrets: inherit

  execute_tests:
    needs: validate_job_automation
    if: needs.validate_job_automation.outputs.found == 'true' && vars.TESTS_ENABLED == 'true'
    uses: nriofrio2508/my_reusable/.github/workflows/test_databricks_assets.yml@main
    with:
      python_version: '3.11.8'
      poetry_version: '1.8.3'
      test_command: poetry run poe test:execute-jobs
      resource_type: jobs
      path_test: jobs/job_validations
      resource_name: ${{ needs.validate_job_automation.outputs.job_name }}
      environment: qa
      slack_channel_notification_failure: '#automatech-alerts'
      notify_on_success: true
      vault_vars: >
        DATABRICKS_HOSTNAME_QA, DATABRICKS_CLUSTER_ID_QA, DATABRICKS_HOSTNAME_STG, DATABRICKS_CLUSTER_ID_STG
      vault_secrets: >
        DATABRICKS_TOKEN_QA, DATABRICKS_TOKEN_STG
    secrets: inherit

  send_datadog:
    needs: [validate_deploy, execute_tests]
    if: always()
    uses: nriofrio2508/my_reusable/.github/workflows/send_datadog.yml@main
    with:
      environment: qa
      actor: ${{ github.triggering_actor }}
      deploy_status: ${{ needs.validate_deploy.result }}
      artifact_extra_info: ${{ needs.execute_tests.outputs.status && 'tests_summary_info' || ''}}
    secrets: inherit