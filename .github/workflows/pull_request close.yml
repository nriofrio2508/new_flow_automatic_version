name: Pull Request Merged

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  show-changed-files:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar archivos modificados del PR mergeado
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number;

            if (!pullNumber) {
              core.setFailed('No se encontro el numero del pull request.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            if (files.length === 0) {
              core.info('No se detectaron archivos modificados en el pull request.');
              return;
            }

            core.info('Archivos modificados en el pull request:');
            for (const file of files) {
              core.info(`- ${file.filename}`);
            }